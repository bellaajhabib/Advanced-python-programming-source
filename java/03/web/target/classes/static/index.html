<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OOP Dogs — Spring Boot</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6f1;color:#18251f;font:15px system-ui,sans-serif}.page{width:min(760px,calc(100% - 32px));margin:auto;padding:44px 0}.eyebrow{color:#397b57;font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}h1,h2{letter-spacing:-.04em}h1{font-size:clamp(2.4rem,7vw,4rem);margin:8px 0}h2{margin:0 0 12px}.intro,.status,footer{color:#65736a}.panel{background:white;border:1px solid #e0e7df;border-radius:16px;padding:18px;margin:12px 0}.create{display:flex;align-items:end;gap:10px;flex-wrap:wrap}.create h2{flex-basis:100%;margin:0}.field{display:grid;gap:5px;color:#65736a;flex:1 1 150px}input{padding:10px;border:1px solid #d9e1d9;border-radius:8px;font:inherit}button{border:0;border-radius:8px;padding:10px 14px;background:#236b43;color:white;font-weight:600;cursor:pointer}.secondary{background:#eef4ee;color:#236b43}.dog{display:flex;justify-content:space-between;align-items:center;gap:12px}.dog h2{margin:0 0 5px}.dog p{margin:0;color:#65736a}.actions{display:flex;gap:8px}.message{color:#236b43;font-weight:600}.error{color:#963c30;font-weight:600}footer{font-size:.84rem;margin-top:24px}
  </style>
</head>
<body><main class="page">
  <p class="eyebrow">Java · Spring Boot · OOP</p>
  <h1>Dog playground</h1>
  <p class="intro">Spring receives web requests and calls methods on Dog objects.</p>
  <form id="create-form" class="panel create">
    <h2>Create a Dog object</h2>
    <label class="field">Name <input name="name" required maxlength="40" placeholder="e.g. Max"></label>
    <label class="field">Age <input name="age" type="number" min="0" step="1" required placeholder="3"></label>
    <button>Add dog</button>
  </form>
  <p id="status" class="status" role="status">Choose an action or create a dog.</p>
  <section id="dogs" aria-label="Dog objects"></section>
  <footer>Spring Boot serves this page and the JSON API. Dog objects are kept in memory and reset when the app restarts.</footer>
</main><script>
const list=document.querySelector('#dogs');const status=document.querySelector('#status');
async function loadDogs(){const response=await fetch('/api/dogs');const dogs=await response.json();list.replaceChildren();for(const dog of dogs){const card=document.createElement('article');card.className='panel dog';const details=document.createElement('div');const name=document.createElement('h2');name.textContent=dog.name;const age=document.createElement('p');age.textContent=`Age: ${dog.age}`;details.append(name,age);const actions=document.createElement('div');actions.className='actions';for(const [action,label] of [['bark','Bark'],['birthday','Birthday (+1)']]){const button=document.createElement('button');button.className='secondary';button.textContent=label;button.addEventListener('click',()=>runAction(dog.id,action));actions.append(button)}card.append(details,actions);list.append(card)}}
async function runAction(id,action){const response=await fetch(`/api/dogs/${id}/${action}`,{method:'POST'});const result=await response.json();status.textContent=action==='bark'?result.message:`Happy birthday, ${result.name}! Age is now ${result.age}.`;await loadDogs()}
document.querySelector('#create-form').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget;const values=Object.fromEntries(new FormData(form));const response=await fetch('/api/dogs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:values.name,age:Number(values.age)})});const result=await response.json();if(!response.ok){status.textContent=result.error;return}status.textContent=`Created a new Dog object for ${result.name}.`;form.reset();await loadDogs()});
loadDogs().catch(()=>{status.textContent='Could not load dogs. Is the Spring Boot server running?'})
</script></body></html>
